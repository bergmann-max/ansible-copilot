name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: arm64
    container: node:${{ matrix.node-version }}-slim
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run lint

  sync-check:
    runs-on: arm64
    container: node:24-slim@sha256:6f7b03f7c2c8e2e784dcf9295400527b9b1270fd37b7e9a7285cf83b6951452d
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/sync.js --check

  smoke:
    runs-on: arm64
    container: node:24-slim@sha256:6f7b03f7c2c8e2e784dcf9295400527b9b1270fd37b7e9a7285cf83b6951452d
    steps:
      - uses: actions/checkout@v4
      - run: node bin/install.js --list --non-interactive --no-color
      - run: node bin/install.js --dry-run --all --non-interactive --no-color
      - run: node bin/install.js --dry-run --only opencode --non-interactive --no-color

  sync-commit:
    if: github.event_name == 'push'
    needs: [lint, sync-check, smoke]
    runs-on: arm64
    container: node:24@sha256:19cd848a0e073d34bd8cd5545a1b6b4d28489b3e3b607366621ced442bd5f6b4
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/sync.js
      - name: Commit if changed
        run: |
          git diff --exit-code || (
            git config user.name "tanuki.sh[bot]"
            git config user.email "tanuki.sh@proton.me"
            git add -A
            git commit -m "chore: sync generated files [skip ci]"
            git push
          )
